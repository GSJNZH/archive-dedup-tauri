[package]
name = "archive-dedup-tauri"
version = "1.3.0"
description = "ArchiveDedup - 素材归档去重工具"
authors = ["GSJNZH"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "archive_dedup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2"
md-5 = "0.10"
